<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>lemazain window</title>
<link rel="stylesheet" href="/lemazain/site.css">
<link rel="stylesheet" href="/lemazain/win.css">
<style>
  html,body{margin:0;background:transparent;overflow:hidden}
  body{padding:0}
  .embed{width:100vw;height:100vh;display:flex;align-items:stretch}
  .embed > div{flex:1;margin:0!important;max-width:none!important;height:100%}
</style>
</head>
<body>
<div class="embed"><div class="kwin" data-kwin data-state="pods" id="stage-win" role="img" aria-label="lemazain walking through live tables, filters, problems, the inspector, logs, the palette and the production guard"></div></div>
<script>
  const embed = document.querySelector(".embed");
  const fit = () => {
    const s = innerWidth < 600 ? 1 : Math.min(1, innerWidth / 1080);
    embed.style.zoom = s;
    embed.style.width = `${innerWidth / s}px`;
    embed.style.height = `${innerHeight / s}px`;
  };
  fit();
  addEventListener("resize", fit);
</script>
<script src="/lemazain/win.js" defer></script>
</body>
</html>
