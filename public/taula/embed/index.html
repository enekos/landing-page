<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>taula window</title>
<link rel="stylesheet" href="/taula/site.css">
<style>
  html,body{margin:0;background:transparent;overflow:hidden}
  body{padding:0}
  .embed{width:100vw;height:100vh;display:flex;align-items:stretch}
  .embed > div{flex:1;margin:0!important;max-width:none!important;height:100%}
</style>
</head>
<body>
<div class="embed"><div class="win" data-state="query" data-live data-win role="img" aria-label="Taula, writing a query, streaming its results as they arrive, and handing an approved change to the assistant"></div></div>
<script src="/taula/win.js" defer></script>
<script src="/taula/live.js" defer></script>
</body>
</html>
